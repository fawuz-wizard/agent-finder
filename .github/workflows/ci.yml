name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.invalid
          VITE_AUTH_MODE: demo

  api:
    name: API — lint, tests, migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: agentfinder
          POSTGRES_PASSWORD: agentfinder
          POSTGRES_DB: agentfinder
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentfinder -d agentfinder"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://agentfinder:agentfinder@localhost:5432/agentfinder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Migrations apply cleanly
        run: alembic upgrade head
      - name: PostGIS is enabled
        run: |
          python - <<'PY'
          import asyncio, asyncpg
          async def main():
              c = await asyncpg.connect("postgresql://agentfinder:agentfinder@localhost:5432/agentfinder")
              v = await c.fetchval("SELECT PostGIS_Version()")
              print("PostGIS", v); await c.close()
          asyncio.run(main())
          PY
