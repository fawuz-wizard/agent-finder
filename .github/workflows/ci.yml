name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.invalid
          VITE_AUTH_MODE: demo

  api:
    name: API — lint, tests, migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: agentfinder
          POSTGRES_PASSWORD: agentfinder
          POSTGRES_DB: agentfinder
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentfinder -d agentfinder"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://agentfinder:agentfinder@localhost:5432/agentfinder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Migrations apply cleanly
        run: alembic upgrade head
      - name: PostGIS is enabled
        run: |
          python - <<'PY'
          import asyncio, asyncpg
          async def main():
              c = await asyncpg.connect("postgresql://agentfinder:agentfinder@localhost:5432/agentfinder")
              v = await c.fetchval("SELECT PostGIS_Version()")
              print("PostGIS", v); await c.close()
          asyncio.run(main())
          PY

  api-image:
    name: API — container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image hosts will run
        run: docker build -t agent-finder-api apps/api
      - name: Boot it against SQLite and hit /health
        run: |
          docker run -d --name api -p 8000:8000 \
            -e APP_ENV=test -e SEED_ON_START=false -e OPERATOR_ADAPTER=none \
            -e DATABASE_URL=sqlite+aiosqlite:////tmp/smoke.db agent-finder-api
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
          echo; docker logs api | tail -20
          curl -sf http://localhost:8000/health
          docker rm -f api
