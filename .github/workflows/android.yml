name: Android APK

# Builds the customer/agent/dealer app as a debug APK for sideloading onto test phones.
# The screens are the normal web build; Capacitor packages them into an Android shell.
#
# API address: set the repository variable API_BASE_URL (Settings → Secrets and variables →
# Actions → Variables) to the hosted API, e.g. https://api.example.com, and the APK runs in live
# mode against it. With no variable set, the APK runs in mock mode on the in-app demo network,
# which is enough to show every screen on a phone with no server at all.

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API base URL for this build (blank = mock mode)"
        required: false
        default: ""

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # the pilot release

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    env:
      API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm ci

      - name: Gates
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Signing key
        # One stable key (repository secrets ANDROID_KEYSTORE_B64 / _PASSWORD / ANDROID_KEY_ALIAS),
        # so each build can update the previous one on a phone. Without the secrets the build is
        # signed with a throwaway debug key and must be uninstalled before the next install.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/agent-finder-signing.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/agent-finder-signing.p12" >> "$GITHUB_ENV"
            echo "Using the pilot signing key"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret: signing with a throwaway debug key"
          fi

      # Two installs from one codebase. Each flavour is assembled right after its own web
      # build, because `cap sync` copies the same assets folder for both.
      - name: Build the Agent Finder (customers) and the Agent App (agents and dealers)
        env:
          VITE_API_MODE: ${{ env.API_BASE_URL != '' && 'live' || 'mock' }}
          VITE_API_BASE_URL: ${{ env.API_BASE_URL }}
          # A plain-http API (a laptop on the phone's hotspot) is only reachable if the shell
          # serves the page from http://localhost; see capacitor.config.ts.
          CAP_ALLOW_HTTP: ${{ startsWith(env.API_BASE_URL, 'http://') && '1' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "Building in ${VITE_API_MODE} mode${VITE_API_BASE_URL:+ against $VITE_API_BASE_URL}; CAP_ALLOW_HTTP=${CAP_ALLOW_HTTP:-<unset>}"
          mode=$([ -n "$API_BASE_URL" ] && echo live || echo mock)
          build_one () {  # $1 surface (customer|agent)  $2 flavour (finder|agent)  $3 file prefix
            CAPACITOR_BUILD=1 VITE_APP_SURFACE="$1" npm run build
            npx cap sync android
            (cd android && ./gradlew "assemble$(echo "$2" | sed 's/./\U&/')Debug" --no-daemon)
            cp "android/app/build/outputs/apk/$2/debug/app-$2-debug.apk" "$3-${mode}-${GITHUB_SHA::7}.apk"
          }
          build_one customer finder agent-finder
          build_one agent agent agent-app
          ls -la *.apk

      - name: Show the signer
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for f in agent-finder-*.apk agent-app-*.apk; do
            echo "== $f"; "$apksigner" verify --print-certs "$f" | grep -E "Signer .* DN|SHA-256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: agent-finder-apk
          path: apps/web/agent-finder-*.apk
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: agent-app-apk
          path: apps/web/agent-app-*.apk
          if-no-files-found: error
          retention-days: 30

      # One stable download link per app, so a printed QR code keeps working build after
      # build: the "pilot-latest" release is replaced every time main changes. Mock builds
      # carry the demo network inside, so a phone needs no server to show every screen.
      - name: Publish to the pilot release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$([ -n "$API_BASE_URL" ] && echo live || echo mock)
          cp agent-finder-*.apk agent-finder.apk
          cp agent-app-*.apk agent-app.apk
          {
            echo "Built from \`${GITHUB_SHA::7}\` on $(date -u +'%Y-%m-%d %H:%M UTC') in **${mode}** mode."
            echo
            cat ../../docs/demo/release-notes.md
          } > notes.md
          if gh release view pilot-latest >/dev/null 2>&1; then
            gh release edit pilot-latest --title "Pilot build (latest)" --notes-file notes.md --latest
            gh release upload pilot-latest agent-finder.apk agent-app.apk --clobber
          else
            gh release create pilot-latest agent-finder.apk agent-app.apk --title "Pilot build (latest)" --notes-file notes.md --latest
          fi
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/pilot-latest/agent-finder.apk"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/pilot-latest/agent-app.apk"
